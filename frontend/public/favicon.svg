<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-gold" x1="16" y1="84" x2="84" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9B6826" />
      <stop offset="35%" stop-color="#D19650" />
      <stop offset="65%" stop-color="#F9E8C7" />
      <stop offset="100%" stop-color="#D19650" />
    </linearGradient>
    <linearGradient id="favicon-silk" x1="22" y1="88" x2="88" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A0E18" />
      <stop offset="40%" stop-color="#661521" />
      <stop offset="85%" stop-color="#8B1E2F" />
      <stop offset="100%" stop-color="#B32B40" />
    </linearGradient>
    <filter id="favicon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D19650" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fondo circular oscuro de lujo sastre -->
  <rect width="100" height="100" rx="24" fill="#1C1311" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#D19650" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Lazo de seda trasera -->
  <path
    d="M 88 36 C 85 28, 79 24, 73 25 C 65 26, 56 34, 46 44 C 36 54, 28 58, 22 52 C 16 46, 18 36, 24 28 C 30 20, 40 18, 50 20"
    stroke="url(#favicon-silk)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.9"
  />

  <!-- Monograma F de Marfil -->
  <path d="M 28 18 H 74 V 30 H 42 V 44 H 64 V 55 H 42 V 82 H 28 Z" fill="#FAF6F0" />

  <!-- Aguja de Oro Champán -->
  <g filter="url(#favicon-glow)">
    <path
      d="M 16 84 L 69 31 C 71 29, 73 25, 77 21 C 80.5 17.5, 84 19, 82 23 C 78 27, 74 30, 71 33 L 18 86 Z"
      fill="url(#favicon-gold)"
    />
    <ellipse cx="75" cy="25" rx="1.5" ry="4" transform="rotate(45 75 25)" fill="#1C1311" />
  </g>

  <!-- Lazo de seda delantera -->
  <path
    d="M 75 25 C 73 30, 68 36, 58 46 C 48 56, 42 66, 38 76 C 34 86, 28 92, 22 90"
    stroke="url(#favicon-silk)"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Destello de Ojo de Aguja -->
  <path
    d="M 81 15 L 82.5 19 L 86.5 20.5 L 82.5 22 L 81 26 L 79.5 22 L 75.5 20.5 L 79.5 19 Z"
    fill="#FFF9EC"
  />
</svg>
