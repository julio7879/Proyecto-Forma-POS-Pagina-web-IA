name: Telegram Alerts (PRs & Issues)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened, closed]

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Notificación a Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EVENT_TYPE="🚀 NUEVO PULL REQUEST"
            TITLE="${{ github.event.pull_request.title }}"
            AUTHOR="${{ github.event.pull_request.user.login }}"
            URL="${{ github.event.pull_request.html_url }}"
            BRANCH="${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}"
            BODY="${{ github.event.pull_request.body }}"
            # Truncar descripción a 400 caracteres para legibilidad en Telegram
            BODY_SHORT=$(echo "$BODY" | head -c 400)
            
            MSG="<b>${EVENT_TYPE}</b>%0A%0A"
            MSG="${MSG}<b>📌 Título:</b> ${TITLE}%0A"
            MSG="${MSG}<b>👤 Autor:</b> @${AUTHOR}%0A"
            MSG="${MSG}<b>🌿 Rama:</b> <code>${BRANCH}</code>%0A"
            MSG="${MSG}<b>🔗 Enlace:</b> <a href=\"${URL}\">Ver PR #${{ github.event.pull_request.number }}</a>%0A%0A"
            MSG="${MSG}<b>📝 Descripción:</b>%0A<i>${BODY_SHORT}...</i>"
          else
            EVENT_TYPE="📋 EVENTO EN TAREA (ISSUE #${{ github.event.issue.number }})"
            TITLE="${{ github.event.issue.title }}"
            AUTHOR="${{ github.event.sender.login }}"
            ACTION="${{ github.event.action }}"
            URL="${{ github.event.issue.html_url }}"
            
            MSG="<b>${EVENT_TYPE}</b>%0A%0A"
            MSG="${MSG}<b>📌 Título:</b> ${TITLE}%0A"
            MSG="${MSG}<b>⚙️ Acción:</b> ${ACTION}%0A"
            MSG="${MSG}<b>👤 Por:</b> @${AUTHOR}%0A"
            MSG="${MSG}<b>🔗 Enlace:</b> <a href=\"${URL}\">Ver Tarea</a>"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
